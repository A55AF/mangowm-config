# Key Bindings
# Ported from niri (binds.kdl + recent-windows binds). SUPER = niri's Mod.
# DMS-only binds are skipped; Noctalia binds further down replace a few of them.
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
#
# NOTE: mango only supports full-line comments, keep comments on their own line.

# ---------------------------------------------------------------------------
# System
# ---------------------------------------------------------------------------
# reload_config was on SUPER+r; niri uses Mod+R for switch-preset-column-width
bind=SUPER+ALT,r,reload_config
# Mod+M is a DMS bind in niri, so it stays "quit" here
bind=SUPER,m,quit
bind=SUPER,Return,spawn,foot
bind=SUPER,q,killclient,

# ---------------------------------------------------------------------------
# Focus  (niri: focus-column-* / focus-window-*)
# ---------------------------------------------------------------------------
bind=SUPER,Left,focusdir,left
bind=SUPER,h,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,l,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,k,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusdir,down

# ---------------------------------------------------------------------------
# Move windows / columns  (niri: move-column-* / move-window-*)
# ---------------------------------------------------------------------------
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,j,exchange_client,down

# consume-or-expel-window-left/right, expel-window-from-column
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right
# mango has no separate "expel", scroller_stack pulls the window out of the stack
bind=SUPER,period,scroller_stack,right

# ---------------------------------------------------------------------------
# Workspaces -> tags  (niri: focus-workspace / move-column-to-workspace)
# ---------------------------------------------------------------------------
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# focus-workspace-up / down
bind=SUPER,i,viewtoleft,0
bind=SUPER,u,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0

# move-column-to-workspace-up / down
bind=SUPER+CTRL,i,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,Up,tagtoleft,0
bind=SUPER+CTRL,Down,tagtoright,0

# move-workspace-up/down (Mod+Shift+I/U/Page_Up/Page_Down) has no mango
# equivalent: tags are fixed, they can't be reordered.

# ---------------------------------------------------------------------------
# Monitors  (niri: focus-monitor-* / move-column-to-monitor-*)
# ---------------------------------------------------------------------------
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up

bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,l,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,j,tagmon,down

# power-off-monitors (toggle, so the same key wakes it again)
bind=SUPER+SHIFT,p,sleep_toggle_monitor,eDP-1

# ---------------------------------------------------------------------------
# Sizing  (niri: set-column-width +-10%, set-window-height +-10%)
# Step is in pixels; ~100px is roughly 5% of a 1920x1080 screen.
# ---------------------------------------------------------------------------
bind=SUPER,equal,resizewin,+100,+0
bind=SUPER,minus,resizewin,-100,+0
bind=SUPER+SHIFT,equal,resizewin,+0,+100
bind=SUPER+SHIFT,minus,resizewin,+0,-100

# switch-preset-column-width (presets: scroller_proportion_preset)
bind=SUPER,r,switch_proportion_preset

# ---------------------------------------------------------------------------
# Window state  (niri: maximize-column / fullscreen-window / floating / center)
# ---------------------------------------------------------------------------
bind=SUPER,f,set_proportion,1.0
bind=SUPER+CTRL,f,togglefullscreen
bind=SUPER+SHIFT,t,togglefloating
# center-column: mango's centerwin only works on floating windows
bind=SUPER,c,centerwin

# ---------------------------------------------------------------------------
# Overview / window switcher  (niri: toggle-overview, recent-windows)
# ---------------------------------------------------------------------------
bind=SUPER,o,toggleoverview
bind=SUPER,Tab,toggleoverview
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev

# ---------------------------------------------------------------------------
# Keyboard shortcuts inhibit  (niri: Mod+Escape)
# Enters an empty key mode where every key goes to the focused window.
# The matching "exit" bind is in the keymode=inhibit block at the end.
# ---------------------------------------------------------------------------
bind=SUPER,Escape,setkeymode,inhibit

# ---------------------------------------------------------------------------
# Your existing mango binds that don't clash with niri
# ---------------------------------------------------------------------------
bind=SUPER,g,toggleglobal,
bind=SUPER,T,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=ALT,z,toggle_scratchpad
bind=ALT,x,switch_proportion_preset,
bind=SUPER,n,switch_layout
bind=alt+shift,Return,dwindle_toggle_split_direction

# relocated because niri uses the old keys:
# minimized (was SUPER+i), restore_minimized (was SUPER+SHIFT+i),
# toggleoverlay (was SUPER+o), togglejump (was ALT+Tab)
bind=SUPER+ALT,i,minimized
bind=SUPER+ALT+SHIFT,i,restore_minimized
bind=SUPER+SHIFT,o,toggleoverlay
bind=SUPER+SHIFT,Tab,togglejump,

# scroller stack
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# tag switch
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0


# Noctalia Binds
# Core binds
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,V,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,Y,spawn,noctalia msg panel-toggle wallpaper
bind=NONE,PRINT,spawn,noctalia msg screenshot-region
bind=SUPER,PRINT,spawn,noctalia msg screenshot-fullscreen
bind=SUPER + SHIFT,a, spawn, noctalia msg annotate
bind=SUPER,x,spawn,noctalia msg panel-toggle session

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings (niri scroll-wheel binds)
# axis_bind_apply_timeout (top of file) replaces niri's cooldown-ms=150.
# Mod+Wheel: focus-workspace-up/down (skips tags without windows)
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
# Mod+Ctrl+Wheel: move-column-to-workspace-up/down
axisbind=SUPER+CTRL,UP,tagtoleft,0
axisbind=SUPER+CTRL,DOWN,tagtoright,0
# Mod+Shift+Wheel: focus-column-left/right
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right
# Mod+Ctrl+Shift+Wheel: move-column-left/right
axisbind=SUPER+CTRL+SHIFT,UP,exchange_client,left
axisbind=SUPER+CTRL+SHIFT,DOWN,exchange_client,right
# Mod+Wheel left/right (horizontal scroll): focus-column-left/right
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER,RIGHT,focusdir,right
# Mod+Ctrl+Wheel left/right: move-column-left/right
axisbind=SUPER+CTRL,LEFT,exchange_client,left
axisbind=SUPER+CTRL,RIGHT,exchange_client,right


# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# Key mode used by SUPER+Escape (niri's keyboard-shortcuts-inhibit toggle).
# Only this one bind exists in the mode, so everything else reaches the app.
# Inhibit mode: captures all keys until escape
keymode=inhibit
bind=SUPER,Escape,setkeymode,default

# back to the default mode for anything sourced below
keymode=default
